{{ extends "global/Page.html" }}
{{ block title }}{{ T.demog_title }}{{ endblock }}
{{ block content }}
<div class="mb-3">
  <label class="col-form-label">{{ T.demog_gender }}</label>
  {{ for opt in gender_options }}
  <div class="form-check">
    <input class="form-check-input" type="radio" name="gender" id="gender_{{ opt.v }}" value="{{ opt.v }}"{{ if opt.checked }} checked{{ endif }}>
    <label class="form-check-label" for="gender_{{ opt.v }}">{{ opt.label }}</label>
  </div>
  {{ endfor }}
  <input type="text" class="form-control mt-1" name="gender_text" maxlength="50" style="max-width: 20rem;">
  {{ formfield_errors 'gender' }}
</div>
<div class="mb-3">
  <label class="col-form-label" for="id_age">{{ T.demog_age }}</label>
  <input type="number" class="form-control" name="age" id="id_age" min="18" max="99" style="max-width: 8rem;">
  {{ formfield_errors 'age' }}
</div>
<div class="mb-3">
  <label class="col-form-label" for="id_edu">{{ T.demog_edu }}</label>
  <select class="form-select" name="edu" id="id_edu">
    <option value="">--</option>
    {{ for opt in edu_options }}<option value="{{ opt.v }}"{{ if opt.checked }} selected{{ endif }}>{{ opt.label }}</option>{{ endfor }}
  </select>
  {{ formfield_errors 'edu' }}
</div>
{{ next_button }}
{{ endblock }}
