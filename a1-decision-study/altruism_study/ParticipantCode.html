{{ extends "global/Page.html" }}
{{ block title }}{{ T.code_title }}{{ endblock }}
{{ block content }}
<p>{{ T.code_body }}</p>
<div class="code-box">{{ code }}</div>
<p class="text-muted">{{ T.code_note }}</p>
{# 来歴の記録（v0.3）: ブラウザの種類と画面幅。参加者には見えない。取得できなくても進める #}
<input type="hidden" name="user_agent" id="id_user_agent" value="">
<input type="hidden" name="screen_width" id="id_screen_width" value="">
{{ next_button }}
{{ endblock }}
{{ block scripts }}
<script>
  (function () {
    try {
      document.getElementById('id_user_agent').value = (navigator.userAgent || '').slice(0, 300);
      document.getElementById('id_screen_width').value = String(window.screen && window.screen.width ? window.screen.width : '');
    } catch (e) { /* 記録に失敗しても回答は続けられる */ }
  })();
</script>
{{ endblock }}
