{{ extends "global/Page.html" }}
{{ block title }}{{ T.confirm_title }}{{ endblock }}
{{ block content }}
<p class="confirm-body">{{ body }}</p>
<div class="mb-3">
  {{ for opt in options }}
  <div class="form-check">
    <input class="form-check-input" type="radio" name="dg_correct" id="dg_correct_{{ opt.v }}" value="{{ opt.v }}"{{ if opt.checked }} checked{{ endif }}>
    <label class="form-check-label" for="dg_correct_{{ opt.v }}">{{ opt.label }}</label>
  </div>
  {{ endfor }}
  {{ formfield_errors 'dg_correct' }}
</div>
{{ next_button }}
{{ endblock }}
